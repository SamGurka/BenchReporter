[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper-discord-bot"
version = "0.1.0"
description = "Serverless Discord bot for Sleeper fantasy football league updates."
requires-python = ">=3.10"
dependencies = [
    "feedparser==6.0.11",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "fastapi==0.116.1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sleeper_discord_bot*"]
